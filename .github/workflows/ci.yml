# Intégration continue et déploiement sur GitHub Pages.
#  - build  : tests puis construction, sur chaque push et chaque pull request (le dossier construit est conservé
#             une semaine comme artefact du run, pour essayer une branche sans toucher à la production) ;
#  - deploy : sur un push vers main uniquement, publie le résultat sur GitHub Pages
#             (https://charlescoiffier.github.io/pi-piquant/).
name: CI et GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique et tags complets : le numéro de version vient du dernier tag (git describe)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Artefact de la branche (essai sans toucher à la production)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pi-piquant-${{ github.ref_name }}
          path: dist
          retention-days: 7
      - name: Préparer GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Envoyer le site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # L'image de l'API (Alpine, polices Liberation, canvas natif) est construite et essayée sans être publiée :
  # on vérifie qu'elle démarre et produit un vrai PNG avec la légende avant tout déploiement.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t pi-piquant-api:ci .
      - name: Démarrer l'API et demander une image
        run: |
          docker run -d --name api -p 8081:8081 -e API_KEY=cle-de-test-pour-la-ci pi-piquant-api:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8081/api/health >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/png)" = 401
          curl -sf -H 'Authorization: Bearer cle-de-test-pour-la-ci' -o out.png 'http://127.0.0.1:8081/api/png?decimales=250&angle=17&taille=1000'
          file out.png | tee /dev/stderr | grep -q 'PNG image data'
      - uses: actions/upload-artifact@v4
        with:
          name: api-exemple
          path: out.png
          retention-days: 7
      - if: failure()
        run: docker logs api
