# Publie l'application sur GitLab Pages à chaque push sur la branche par défaut.
# URL : https://<utilisateur>.gitlab.io/pi-piquant/
pages:
  image: node:22-alpine
  stage: deploy
  script:
    - npm ci
    - npm test
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
